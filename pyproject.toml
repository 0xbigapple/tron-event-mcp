[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tron-event-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.6",
    "motor>=3.6",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
tron-event-mcp = "tron_event_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint."messages control"]
disable = [
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-statements",
    "duplicate-code",
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "invalid-name",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
